name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Descomprimir proyecto
        run: unzip -o proyecto.zip -d build-src

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        working-directory: build-src
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar archivos
        run: |
          mkdir -p salida
          cp build-src/app/build/outputs/apk/debug/*.apk salida/AVRadio.apk
          echo "${{ github.run_number }}" > salida/version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AVRadio-apk
          path: salida/AVRadio.apk

      - name: Publicar para la actualización automática
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete avradio --cleanup-tag -y || true
          gh release create avradio salida/AVRadio.apk salida/version.txt \
            --title "AVRadio 0.3.${{ github.run_number }}" \
            --notes "AVRadio · Creado por DanLab"
